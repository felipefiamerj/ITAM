      <stop offset="0" stop-color="#08317c"/>
      <stop offset="0.48" stop-color="#005fae"/>
      <stop offset="1" stop-color="#061a52"/>
    </linearGradient>
    <linearGradient id="shieldDark" x1="34" y1="34" x2="92" y2="137" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062d75"/>
