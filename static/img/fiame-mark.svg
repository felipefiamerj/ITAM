<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">FIAME logo mark</title>
  <desc id="desc">Shield, cube and circuit mark for FIAME System.</desc>
  <defs>
