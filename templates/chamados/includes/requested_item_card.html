<div class="requested-item-card h-100{% if compact %} requested-item-card-compact{% endif %}">
  <div class="d-flex justify-content-between align-items-start gap-3">
    <div>
      <div class="requested-item-order">Item {{ forloop.counter }}</div>
      <h3 class="h6 mb-1">{{ item.tipo_display }}</h3>
    </div>
    {% if compact %}
      <span class="badge badge-soft">{{ item.quantidade }}x</span>
    {% else %}
      <span class="status-pill status-pill-info">{{ item.quantidade }}x</span>
    {% endif %}
  </div>
  {% if item.observacao %}
    <p class="small text-muted mb-0 mt-2">{{ item.observacao }}</p>
  {% else %}
    <p class="small text-muted mb-0 mt-2">Sem observações adicionais.</p>
  {% endif %}
</div>
